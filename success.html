<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AirTrueIQ Download</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4faf8;
      color: #10202a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      max-width: 560px;
      background: white;
      border-radius: 22px;
      padding: 32px;
      box-shadow: 0 18px 45px rgba(0,0,0,0.12);
      text-align: center;
    }
    h1 {
      margin-top: 0;
      font-size: 30px;
    }
    p {
      font-size: 17px;
      line-height: 1.5;
      color: #42525c;
    }
    .status {
      margin: 20px 0;
      font-weight: bold;
    }
    .btn {
      display: none;
      margin-top: 22px;
      padding: 15px 26px;
      border-radius: 999px;
      background: linear-gradient(90deg, #062b36, #2fc7b7);
      color: white;
      text-decoration: none;
      font-weight: 800;
      letter-spacing: .04em;
    }
    .error {
      color: #9b1c1c;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>AirTrueIQ Download</h1>
    <p>Thank you. We are verifying your secure Stripe payment.</p>

    <div id="status" class="status">Checking payment...</div>

    <a id="downloadBtn" class="btn" href="/downloads/airtrueiq.apk" download>
      Download AirTrueIQ APK
    </a>

    <p style="font-size:13px;margin-top:28px;">
      If the download button does not appear after a few seconds, please contact support with your payment email.
    </p>
  </div>

  <script>
    async function verifyPayment() {
      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get("session_id");
      const statusEl = document.getElementById("status");
      const downloadBtn = document.getElementById("downloadBtn");

      if (!sessionId) {
        statusEl.textContent = "Missing Stripe session ID.";
        statusEl.className = "status error";
        return;
      }

      try {
        const res = await fetch("/api/verify-session?session_id=" + encodeURIComponent(sessionId));
        const data = await res.json();

        if (data && data.paid) {
          statusEl.textContent = "Payment verified. Your download is ready.";
          downloadBtn.style.display = "inline-block";
        } else {
          statusEl.textContent = "Payment not verified yet. Please refresh in a moment.";
          statusEl.className = "status error";
        }
      } catch (err) {
        statusEl.textContent = "Verification error. Please refresh or contact support.";
        statusEl.className = "status error";
      }
    }

    verifyPayment();
  </script>
</body>
</html>
